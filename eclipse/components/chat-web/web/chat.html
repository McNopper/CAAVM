<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OpenCode Chat</title>
<link rel="stylesheet" href="katex/katex.min.css">
<!-- highlight.js themes: exactly one is enabled, switched by __setTheme -->
<link rel="stylesheet" href="hljs/github.min.css" id="hljs-light">
<link rel="stylesheet" href="hljs/github-dark.min.css" id="hljs-dark" disabled>
<script src="katex/katex.min.js"></script>
<script src="markdown-it.min.js"></script>
<script src="hljs/highlight.min.js"></script>
<script src="hljs/cmake.min.js"></script>
<script src="mermaid.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  /* only #chat scrolls - without overflow:hidden here the document scrolls too
     and the view shows two vertical scroll bars */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    background: var(--bg, #ffffff);
    color: var(--fg, #1f1f1f);
  }
  body.dark {
    --bg: #1e1e1e; --fg: #d4d4d4;
    --bubble-user-bg: #0b3a6f; --bubble-user-fg: #ffffff;
    --bubble-ai-bg: #2a2a2a;
    --border: #3c3c3c; --code-bg: #141414; --muted: #9a9a9a;
  }
  body.light, body:not(.dark) {
    --bg: #ffffff; --fg: #1f1f1f;
    --bubble-user-bg: #1a6ac0; --bubble-user-fg: #ffffff;
    --bubble-ai-bg: #f3f3f3;
    --border: #d0d0d0; --code-bg: #f5f5f5; --muted: #777777;
  }
  #chat { padding: 10px 12px 16px 12px; overflow-y: auto; overflow-x: hidden; height: 100%; }
  .msg { margin: 8px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 88%; padding: 8px 12px; border-radius: 10px;
    overflow-wrap: break-word; line-height: 1.45;
  }
  .msg.user .bubble { background: var(--bubble-user-bg); color: var(--bubble-user-fg); }
  .msg.assistant .bubble { background: var(--bubble-ai-bg); border: 1px solid var(--border); flex: 1; }
  .bubble p { margin: 0.35em 0; }
  .bubble pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
                padding: 8px; overflow-x: auto; }
  .bubble code { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .bubble :not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
  .bubble table { border-collapse: collapse; margin: 6px 0; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 8px; }
  .bubble blockquote { border-left: 3px solid var(--border); margin: 6px 0; padding-left: 10px; color: var(--muted); }
  .bubble img { max-width: 100%; }
  /* long formulas scroll instead of overflowing the bubble */
  .bubble .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 0.5em 0; }
  .bubble .katex { font-size: 1.05em; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .notice { font-size: 12px; color: var(--muted); margin: 6px 4px; text-align: center; }
  .stream-raw { white-space: pre-wrap; font-family: Consolas, monospace; }
  .cursor { display: inline-block; width: 7px; height: 14px; background: var(--fg);
            vertical-align: text-bottom; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .reasoning { border-left: 3px solid var(--muted); color: var(--muted); font-size: 12px;
               padding-left: 8px; margin: 4px 0; }
  .reasoning > summary { cursor: pointer; user-select: none; }
  .mermaid { display: flex; justify-content: center; margin: 8px 0; }
  .mermaid svg { max-width: 100%; }
  .error { color: #e5554f; }
</style>
</head>
<body>
<div id="chat"></div>
<script src="chat.js"></script>
</body>
</html>
